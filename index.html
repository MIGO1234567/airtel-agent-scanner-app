<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airtel Agent Scanner</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:20px;text-align:center}
header{background:#e60000;color:white;padding:15px;border-radius:10px}
#preview{width:100%;max-width:350px;border:2px solid #e60000;border-radius:10px;margin-top:15px}
#result{font-size:26px;font-weight:bold;color:#e60000;margin-top:15px}
button{background:#e60000;color:white;border:none;padding:12px 20px;border-radius:8px;font-size:16px;margin-top:10px}
input{font-size:18px;padding:10px;width:200px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<header><h2>Airtel Agent Scanner</h2></header>
<p>Take a clear photo of the agent number</p>
<input type="file" id="file" accept="image/*" capture="environment"><br>
<img id="preview"><br>
<button onclick="scanNumber()">Scan Number</button>
<div id="result"></div>
<div id="editBox" style="display:none">
<p style="color:black;font-size:16px">Check / Fix if wrong:</p>
<input id="fixInput" maxlength="8" inputmode="numeric"><br>
<button onclick="copyNum()">Copy Number</button>
</div>
<script>
let imgFile=null;
document.getElementById('file').onchange=e=>{
  imgFile=e.target.files[0];
  document.getElementById('preview').src=URL.createObjectURL(imgFile);
  document.getElementById('result').innerText="";
  document.getElementById('editBox').style.display="none";
};
async function scanNumber(){
  if(!imgFile){alert("Take a photo first");return;}
  document.getElementById('result').innerText="Scanning with cloud OCR... please wait";
  let form=new FormData();
  form.append("file",imgFile);
  form.append("apikey","helloworld");
  form.append("OCREngine","2");
  form.append("scale","true");
  try{
    let r=await fetch("https://api.ocr.space/parse/image",{method:"POST",body:form});
    let j=await r.json();
    let text=j.ParsedResults && j.ParsedResults[0] ? j.ParsedResults[0].ParsedText : "";
    let cleaned=text.replace(/[^0-9]/g,'');
    let match=cleaned.match(/\d{8}/);
    if(match){
      document.getElementById('result').innerHTML="✅ Agent Number Found:<br>"+match[0];
      document.getElementById('fixInput').value=match[0];
      document.getElementById('editBox').style.display="block";
    }else{
      document.getElementById('result').innerText="❌ No 8-digit number found. Found: "+cleaned+" - Try retaking closer";
      document.getElementById('fixInput').value=cleaned.slice(0,8);
      document.getElementById('editBox').style.display="block";
    }
  }catch(e){
    document.getElementById('result').innerText="❌ Internet error. Check data and try again.";
  }
}
function copyNum(){
  let v=document.getElementById('fixInput').value;
  navigator.clipboard.writeText(v);
  alert("Copied: "+v);
}
</script>
</body>
</html>
